<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ff2773" />
    <title>Salita is offline</title>
    <style>
      :root {
        font-family: Avenir, system-ui, sans-serif;
        color: #000;
        background: #ebeff7;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        box-sizing: border-box;
      }
      main {
        width: min(100%, 480px);
        padding: 32px;
        box-sizing: border-box;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 4px 20px rgba(25, 1, 52, 0.14);
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 28px;
        letter-spacing: -0.04em;
      }
      p {
        color: #616669;
        line-height: 1.55;
      }
      button {
        min-height: 48px;
        margin-top: 12px;
        border: 0;
        border-radius: 5px;
        padding: 0 20px;
        background: #ff2773;
        color: #000;
        font: inherit;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Salita is offline</h1>
      <p>
        If a lesson was already open, keep it open—your answers queue on this
        device. Reconnect to reopen the app and sync your progress.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
